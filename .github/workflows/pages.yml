# Deploys the repository root to GitHub Pages. There is no build step: the game is static files.
# Needs: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Pages
on:
  push:
    branches: [develop, claude/build-skitch-game-ntnaek]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html sw.js manifest.webmanifest icon.svg icon-*.png js vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
  # Reports on the controller and the generator; does not hold the deploy back.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/bot.js 200 240
      - run: node tests/chim.js
